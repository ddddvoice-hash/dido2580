# 푸시할 때마다 저장소의 모든 테스트를 돌린다. 녹음 파일이나 API 키는 쓰지 않는다(전부 합성 데이터).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  saju:
    name: 사주 패키지 (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  voice-persona:
    name: 보이스 페르소나 실험실 (Streamlit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice-persona
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 배포용 설정(저장소 맨 위)과 앱 설정이 같은지 (문법과 값을 함께 비교)
        run: |
          python - <<'PY'
          import sys, tomllib
          paths = ["../../.streamlit/config.toml", ".streamlit/config.toml"]
          try:
              a, b = [tomllib.load(open(p, "rb")) for p in paths]
          except Exception as e:
              print("설정 파일을 읽지 못했어요:", e)
              sys.exit(1)
          if a != b:
              print("두 설정이 달라요.")
              print(paths[0], a)
              print(paths[1], b)
              sys.exit(1)
          print("두 설정이 같아요:", a)
          PY
        shell: bash

  voice-node:
    name: 녹음 검사기·녹음 부스 (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 녹음 검사기
        run: |
          node apps/voice-check/test.js
          node apps/voice-check/test-align.js
          node apps/voice-check/test-profile.js
          node apps/voice-check/test-screen.js
          node apps/voice-check/test-compare-ai.js
      - name: 녹음 부스 (팀 검사기와 판정 일치, 대본 96줄 일치)
        run: |
          node apps/voice-studio/tests/parity.test.js
          node apps/voice-studio/tests/lines.test.js
          node apps/voice-studio/tests/reference.test.js
      - name: 낭독 코치 (속도·쉼 비교와 피드백)
        run: node apps/reading-coach/tests/test-analysis.js
      - name: 실제 브라우저 검사 (녹음 부스 33가지, 낭독 코치 48가지)
        env:
          CHROMIUM: /usr/bin/google-chrome
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node apps/voice-studio/tests/browser.test.js
          node apps/reading-coach/tests/browser.test.js

  warmth-scorer:
    name: 따뜻함 채점기 (실제 브라우저 29+10가지, 평가자 일치도·신뢰도 α)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/warmth-scorer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 기준표 자동 로드를 위한 로컬 서버
        run: |
          python3 -m http.server 8765 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "서버가 꺼졌어요. 로그:"; cat /tmp/server.log; exit 1
            fi
            if curl -fsS -o /dev/null http://127.0.0.1:8765/index.html; then
              echo "서버가 응답해요."; exit 0
            fi
            sleep 1
          done
          echo "30초 안에 서버가 응답하지 않았어요. 로그:"; cat /tmp/server.log; exit 1
      - name: 브라우저 검수
        env:
          CHROME: /usr/bin/google-chrome
        run: node tests/browser-check.mjs http://127.0.0.1:8765 "file://$PWD/index.html" rubric.json
      - name: 평가자 일치도 계산, 상황 문항 세트 형식
        run: |
          node tests/agreement.test.js
          node tests/scenarios.test.js
      - name: 평가자 일치도 화면
        env:
          CHROMIUM: /usr/bin/google-chrome
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node tests/agreement.browser.js
          node tests/pack.browser.js
      - name: 평가 묶음 파일이 만드는 스크립트 결과와 같은지
        run: |
          python3 ../../docs/eval/packs/build_packs.py
          git diff --exit-code -- ../../docs/eval/packs
      - name: 평가 묶음 겉모양 단서 검사(엄격: 단서 하나가 80% 넘게 맞히면 실패)
        run: python3 ../../docs/eval/packs/cue_check.py --strict
      - name: 크리펜도르프 α를 공개 패키지(krippendorff)와 무작위 300묶음으로 대조
        run: |
          python3 -m pip install --quiet krippendorff numpy
          python3 tests/alpha_crosscheck.py
