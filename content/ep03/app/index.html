<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자 읽기 변환기</title>
<style>
  @font-face { font-family: NSK; src: url("fonts/nsk-400.ttf"); font-weight: 400; }
  @font-face { font-family: NSK; src: url("fonts/nsk-700.ttf"); font-weight: 700; }
  @font-face { font-family: NSK; src: url("fonts/nsk-900.ttf"); font-weight: 900; }
  :root { --bg:#f4f1ea; --card:#ffffff; --ink:#15161a; --sub:#6b6f78; --line:#e2ddd2; --accent:#ff5a1f; --ok:#1a7f5a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:NSK, sans-serif; }
  .wrap { padding:48px 44px; }
  header { display:flex; align-items:center; gap:16px; margin-bottom:36px; }
  .logo { width:64px; height:64px; border-radius:18px; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:900; font-size:30px; }
  h1 { margin:0; font-size:40px; font-weight:900; letter-spacing:-1px; }
  .sub { color:var(--sub); font-size:24px; margin-top:4px; }
  .box { background:var(--card); border:3px solid var(--line); border-radius:28px; padding:28px; }
  label { font-size:24px; color:var(--sub); font-weight:700; }
  .row { display:flex; gap:16px; margin-top:14px; }
  input { flex:1; font:900 46px NSK; padding:18px 22px; border:3px solid var(--ink); border-radius:18px; outline:none; min-width:0; }
  button { font:900 36px NSK; padding:0 30px; border:0; border-radius:18px; background:var(--accent); color:#fff; }
  button.press { transform:scale(.94); filter:brightness(.9); }
  ul { list-style:none; margin:30px 0 0; padding:0; display:flex; flex-direction:column; gap:22px; }
  li { background:var(--card); border:3px solid var(--line); border-radius:28px; padding:26px 30px; }
  li.hi { border-color:var(--accent); box-shadow:0 0 0 6px rgba(255,90,31,.18); }
  .in { font-size:30px; color:var(--sub); font-weight:700; }
  .arrow { font-size:26px; color:var(--sub); margin:6px 0; }
  .out { font-size:58px; font-weight:900; color:var(--ok); letter-spacing:-1px; line-height:1.2; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">읽</div>
    <div><h1>숫자 읽기 변환기</h1><div class="sub">글자 그대로 입력하면, 소리 내 읽는 말로 바꿔요</div></div>
  </header>
  <div class="box">
    <label for="q">문장 입력</label>
    <div class="row"><input id="q" autocomplete="off"><button id="go">읽기</button></div>
  </div>
  <ul id="list"></ul>
</div>
<script>
  const q = document.getElementById("q"), go = document.getElementById("go"), list = document.getElementById("list");
  async function read() {
    const text = q.value.trim();
    if (!text) return;
    const r = await fetch("/api/normalize?text=" + encodeURIComponent(text));
    const d = await r.json();
    const li = document.createElement("li");
    li.innerHTML = '<div class="in"></div><div class="arrow">↓ 이렇게 읽어요</div><div class="out"></div>';
    li.querySelector(".in").textContent = d.input;
    li.querySelector(".out").textContent = d.output;
    list.prepend(li);
    q.value = "";
    window.lastResult = d;
  }
  go.addEventListener("click", read);
  q.addEventListener("keydown", e => { if (e.key === "Enter") read(); });
  window.clearList = () => { list.innerHTML = ""; };
</script>
</body>
</html>
